services:
  kafka:
    image: apache/kafka:latest
    networks:
      - app-network
    ports:
      - "${KAFKA_PORT}:9092"
      - "${KAFKA_HOST_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: kafbat/kafka-ui:latest
    networks:
      - app-network
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  inventory-service:
    build:
      context: ./app/inventory-service
      dockerfile: Dockerfile
    image: inventory-service:latest
    networks:
      - app-network
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
    depends_on:
      - kafka

  order-service:
    build:
      context: ./app/order-service
      dockerfile: Dockerfile
    image: order-service:latest
    networks:
      - app-network
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT}
      PAYMENT_SERVICE_URL: http://payment-service:${PAYMENT_SERVICE_PORT}
    depends_on:
      - kafka
      - inventory-service
      - payment-service
      - shipping-service

  payment-service:
    build:
      context: ./app/payment-service
      dockerfile: Dockerfile
    image: payment-service:latest
    networks:
      - app-network
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
    depends_on:
      - kafka

  shipping-service:
    build:
      context: ./app/shipping-service
      dockerfile: Dockerfile
    image: shipping-service:latest
    networks:
      - app-network
    ports:
      - "${SHIPPING_SERVICE_PORT}:${SHIPPING_SERVICE_PORT}"
    environment:
      SHIPPING_SERVICE_PORT: ${SHIPPING_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
    depends_on:
      - kafka

networks:
  app-network:
    name: app-network
    driver: bridge
