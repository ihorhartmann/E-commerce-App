services:
  postgres:
    image: postgres:18-alpine
    networks:
      - app-network
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # --import-realm only creates a realm that doesn't exist yet: after editing the realm file,
    # delete the realm (admin console) or recreate the postgres volume for the change to apply
    command: ["start-dev", "--import-realm"]
    networks:
      - app-network
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # public URL, always used as the token issuer (iss) - whoever requested the token
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      # lets other containers use http://keycloak:8080 for back-channel calls (token, jwks)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET}
      GATEWAY_PORT: ${GATEWAY_PORT}
    volumes:
      - ./docker/keycloak/realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    networks:
      - app-network
    ports:
      - "${KAFKA_PORT}:9092"
      - "${KAFKA_HOST_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    networks:
      - app-network
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  inventory-service:
    build:
      context: ./app/inventory-service
      dockerfile: Dockerfile
    image: inventory-service:latest
    networks:
      - app-network
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Keycloak realm whose access tokens are accepted: public URL (= iss), keys from inside the network
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./app/order-service
      dockerfile: Dockerfile
    image: order-service:latest
    networks:
      - app-network
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT}
      PAYMENT_SERVICE_URL: http://payment-service:${PAYMENT_SERVICE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./app/payment-service
      dockerfile: Dockerfile
    image: payment-service:latest
    networks:
      - app-network
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  shipping-service:
    build:
      context: ./app/shipping-service
      dockerfile: Dockerfile
    image: shipping-service:latest
    networks:
      - app-network
    ports:
      - "${SHIPPING_SERVICE_PORT}:${SHIPPING_SERVICE_PORT}"
    environment:
      SHIPPING_SERVICE_PORT: ${SHIPPING_SERVICE_PORT}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    depends_on:
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  gateway-service:
    build:
      context: ./app/gateway-service
      dockerfile: Dockerfile
    image: gateway-service:latest
    networks:
      - app-network
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      # public realm URL - equal to `iss` in tokens, used for browser redirects
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/ecommerce
      # the same realm from inside the network - token, jwks, userinfo
      OIDC_INTERNAL_URI: http://keycloak:8080/realms/ecommerce
      OIDC_CLIENT_ID: gateway
      OIDC_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET}
      OIDC_ROLES_CLAIM: realm_access.roles
      ORDER_SERVICE_URL: http://order-service:${ORDER_SERVICE_PORT}
      PAYMENT_SERVICE_URL: http://payment-service:${PAYMENT_SERVICE_PORT}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT}
      SHIPPING_SERVICE_URL: http://shipping-service:${SHIPPING_SERVICE_PORT}
    depends_on:
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      inventory-service:
        condition: service_started
      shipping-service:
        condition: service_started

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres-data:
