# One project name, whichever folder the stack is started from: Alloy collects the logs of this project's containers
# only (docker/alloy/config.alloy).
name: e-commerce-app

services:
  postgres:
    image: postgres:18-alpine
    networks:
      - app-network
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD_FILE: /run/secrets/grafana_db_password
    secrets:
      - postgres_password
      - grafana_db_password
    volumes:
      - postgres-data:/var/lib/postgresql
      # run in the order of their names, once - on a new volume: the schemas first, then the users that read them
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
      - ./docker/postgres/init-grafana-reader.sh:/docker-entrypoint-initdb.d/02-init-grafana-reader.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # --import-realm only creates a realm that doesn't exist yet: after editing the realm file,
    # delete the realm (admin console) or recreate the postgres volume for the change to apply
    # entrypoint.sh reads the secrets Keycloak can only take as environment variables, then runs kc.sh with the command
    entrypoint: ["/bin/bash", "/opt/keycloak/entrypoint.sh"]
    command: ["start-dev", "--import-realm"]
    networks:
      - app-network
    ports:
      - "${KEYCLOAK_PORT}:8080"
    secrets:
      - postgres_password
      - keycloak_admin_password
      - app_admin_password
      - gateway_client_secret
      - order_service_client_secret
      - grafana_client_secret
      - internal_admin_password
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      # the clients for the e2e tests and Postman (the realm's e2e-tests, postman): off in production
      KC_TEST_CLIENTS_ENABLED: ${KC_TEST_CLIENTS_ENABLED:-true}
      # public URL, always used as the token issuer (iss) - whoever requested the token. KEYCLOAK_URL is set in
      # production only (infrastructure/contabo); every OIDC_ISSUER below falls back to the same local URL
      KC_HOSTNAME: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}
      # lets other containers use http://keycloak:8080 for back-channel calls (token, jwks)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # /metrics on the management port, with counters of user events - failed logins among them - for Alloy to scrape
      KC_METRICS_ENABLED: "true"
      KC_EVENT_METRICS_USER_ENABLED: "true"
      # the addresses the browser comes back to after signing in and out (the gateway's redirect URIs in the realm):
      # the gateway itself and the web UI in front of it, both on the one public domain in production
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:${GATEWAY_PORT}}
      WEB_UI_PUBLIC_URL: ${WEB_UI_PUBLIC_URL:-http://localhost:${WEB_UI_PORT}}
      # Grafana, which signs its admin and its observer in through the realm (the grafana client)
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-http://localhost:${GRAFANA_PORT}}
    volumes:
      - ./docker/keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
      - ./docker/keycloak/realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
      # the internal tools' own realm (Grafana): their staff, kept apart from the shop's customers - sessions too
      - ./docker/keycloak/realm-internal.json:/opt/keycloak/data/import/realm-internal.json:ro
      # the login theme, file by file: its glass.css is the web UI's own, so the sign-in pages match the app
      - ./docker/keycloak/themes/ecommerce/login/theme.properties:/opt/keycloak/themes/ecommerce/login/theme.properties:ro
      - ./docker/keycloak/themes/ecommerce/login/resources/css/login.css:/opt/keycloak/themes/ecommerce/login/resources/css/login.css:ro
      - ./app/web-ui/src/jsMain/resources/glass.css:/opt/keycloak/themes/ecommerce/login/resources/css/glass.css:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    networks:
      - app-network
    ports:
      - "${KAFKA_PORT}:9092"
      - "${KAFKA_HOST_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The committed offsets of a group nobody consumes with are dropped after this long (the default is 7 days):
      # dlt-redrive's bookmarks (kafka-init) must last as long as the DLT messages they point at - 30 days
      KAFKA_OFFSETS_RETENTION_MINUTES: 43200
      # The topics, offsets and DLTs live on a volume, so a message survives docker compose down until it is consumed.
      # The cluster id is fixed: the broker refuses a log directory formatted for another cluster.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    # healthy once the broker answers requests - the services wait for that instead of failing to declare their topics
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-off: gives the dlt-redrive group a bookmark at the start of every DLT that has none, so its lag is the number of
  # dead-lettered messages still waiting for a redrive or a discard. Runs once the services have declared their DLTs,
  # then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    command: ["sh", "/opt/kafka-init/init-dlt-redrive.sh"]
    restart: "no"
    networks:
      - app-network
    volumes:
      - ./docker/kafka/init-dlt-redrive.sh:/opt/kafka-init/init-dlt-redrive.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy

  # One-off: the views grafana_reader may read, and nothing else (docker/postgres/grafana-views.sql) - once the
  # order-service's migrations have created its tables - then exits. Runs on every start, so a database initialized
  # before the file existed ends up the same.
  grafana-views:
    image: postgres:18-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        PGPASSWORD="$$(cat /run/secrets/postgres_password)" exec psql -v ON_ERROR_STOP=1 -h postgres
        -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -v owner="$$POSTGRES_USER" -f /grafana-views.sql
    restart: "no"
    networks:
      - app-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - ./docker/postgres/grafana-views.sql:/grafana-views.sql:ro
    depends_on:
      order-service:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    networks:
      - app-network
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # traces: the services send OTLP to alloy, alloy forwards to tempo, grafana reads tempo.
  # logs: the services write to stdout, alloy reads it from Docker and pushes it to loki, grafana reads loki.
  # metrics: the services send OTLP to alloy, alloy forwards to prometheus - with what its own exporters read from
  # postgres, kafka, the containers and keycloak - and grafana reads prometheus.
  # Only grafana and alloy's debug UI are published to the host.
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    networks:
      - app-network
    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    networks:
      - app-network
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # the services' metrics, over OTLP from alloy
      - --web.enable-otlp-receiver
      # the exporters' metrics, from alloy's prometheus.remote_write
      - --web.enable-remote-write-receiver
      # Grafana's viewers can send any query: one can't keep Prometheus busy for long, nor load too much into memory
      - --query.timeout=30s
      - --query.max-samples=10000000
    networks:
      - app-network
    volumes:
      - ./docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  # entrypoint.sh renders its configuration from the variables below first.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    networks:
      - app-network
    environment:
      # empty defaults, so the stacks that don't start it (the e2e tests) need none of them; entrypoint.sh stops
      # the container if one is missing
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-}
      ALERT_SMTP_USERNAME: ${ALERT_SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD_FILE: /run/secrets/alert_smtp_password
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      # where the emails' links lead
      GRAFANA_URL: http://localhost:${GRAFANA_PORT}
    secrets:
      - alert_smtp_password
    volumes:
      - ./docker/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    mem_limit: 512m
    networks:
      - app-network
    ports:
      - "${ALLOY_UI_PORT}:12345"
    environment:
      # the postgres exporter's connection (docker/alloy/config.alloy)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./docker/alloy/postgres-queries.yaml:/etc/alloy/postgres-queries.yaml:ro
      # the containers' logs and metadata, read through the Docker API
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # the Docker host's file systems, cgroups and containers - cAdvisor and the file system exporter
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # containerd's socket, through which cAdvisor finds the Docker containers
      - /run/containerd:/run/containerd:ro
      # how far each container's log has been read, so a restarted Alloy neither loses nor resends lines
      - alloy-data:/var/lib/alloy/data
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started
      # the Kafka exporter connects once, when Alloy loads its config, and doesn't retry
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.4
    networks:
      - app-network
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      # local development only: anyone reaching the port is an admin, no login form
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # light or dark as the operating system is, for every user who hasn't picked a theme of their own
      GF_USERS_DEFAULT_THEME: system
      # the read-only Postgres user of its datasource - see docker/postgres/init-grafana-reader.sh. Grafana's image
      # turns a GF_..._FILE variable into GF_... with the file's content; GF_DATASOURCE_POSTGRES_PASSWORD is no
      # setting of Grafana's, only what provisioning/datasources/datasources.yaml reads
      GF_DATASOURCE_POSTGRES_PASSWORD__FILE: /run/secrets/grafana_db_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - grafana_db_password
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # the dashboards themselves, as JSON - see provisioning/dashboards/dashboards.yaml
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus
      - postgres

  inventory-service:
    build:
      context: ./app/inventory-service
      dockerfile: Dockerfile
    image: inventory-service:latest
    # a service that exits on a failed startup - Kafka not up yet, say - is started again, as Kubernetes would
    restart: on-failure
    networks:
      - app-network
    ports:
      - "${INVENTORY_SERVICE_PORT}:${INVENTORY_SERVICE_PORT}"
    environment:
      INVENTORY_SERVICE_PORT: ${INVENTORY_SERVICE_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: inventory-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      # Keycloak realm whose access tokens are accepted: public URL (= iss), keys from inside the network
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    # the file /run/secrets/DB_PASSWORD (env.GetSecretEnv)
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
    # ready: started, not shutting down, and its database answers - what the services that depend on it wait for
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${INVENTORY_SERVICE_PORT}/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      alloy:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./app/order-service
      dockerfile: Dockerfile
    image: order-service:latest
    # a service that exits on a failed startup - Kafka not up yet, say - is started again, as Kubernetes would
    restart: on-failure
    networks:
      - app-network
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    environment:
      ORDER_SERVICE_PORT: ${ORDER_SERVICE_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: order-service
      LOGGING_LEVEL_COM_HARTMANN: ${LOG_LEVEL:-INFO}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT}
      PAYMENT_SERVICE_URL: http://payment-service:${PAYMENT_SERVICE_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
      OIDC_TOKEN_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/token
      OIDC_CLIENT_ID: order-service
    # read as properties (spring.config.import: configtree), each under the name of the placeholder it fills
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
      - source: order_service_client_secret
        target: OIDC_CLIENT_SECRET
    # ready: started, not shutting down, and its database answers - what the services that depend on it wait for
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${ORDER_SERVICE_PORT}/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      alloy:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      postgres:
        condition: service_healthy

  payment-service:
    build:
      context: ./app/payment-service
      dockerfile: Dockerfile
    image: payment-service:latest
    # a service that exits on a failed startup - Kafka not up yet, say - is started again, as Kubernetes would
    restart: on-failure
    networks:
      - app-network
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      PAYMENT_SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: payment-service
      LOGGING_LEVEL_COM_HARTMANN: ${LOG_LEVEL:-INFO}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    # read as properties (spring.config.import: configtree), each under the name of the placeholder it fills
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
      - source: stripe_secret_key
        target: STRIPE_SECRET_KEY
      - source: stripe_webhook_secret
        target: STRIPE_WEBHOOK_SECRET
    # ready: started, not shutting down, and its database answers - what the services that depend on it wait for
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PAYMENT_SERVICE_PORT}/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      alloy:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  shipping-service:
    build:
      context: ./app/shipping-service
      dockerfile: Dockerfile
    image: shipping-service:latest
    # a service that exits on a failed startup - Kafka not up yet, say - is started again, as Kubernetes would
    restart: on-failure
    networks:
      - app-network
    ports:
      - "${SHIPPING_SERVICE_PORT}:${SHIPPING_SERVICE_PORT}"
    environment:
      SHIPPING_SERVICE_PORT: ${SHIPPING_SERVICE_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: shipping-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KAFKA_HOST: kafka
      KAFKA_PORT: ${KAFKA_PORT}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}/realms/ecommerce
      OIDC_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      OIDC_ROLES_CLAIM: realm_access.roles
    # the file /run/secrets/DB_PASSWORD (env.GetSecretEnv)
    secrets:
      - source: postgres_password
        target: DB_PASSWORD
    # ready: started, not shutting down, and its database answers - what the services that depend on it wait for
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${SHIPPING_SERVICE_PORT}/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      alloy:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  gateway-service:
    build:
      context: ./app/gateway-service
      dockerfile: Dockerfile
    image: gateway-service:latest
    # a service that exits on a failed startup - Kafka not up yet, say - is started again, as Kubernetes would
    restart: on-failure
    networks:
      - app-network
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_SERVICE_NAME: gateway-service
      LOGGING_LEVEL_COM_HARTMANN: ${LOG_LEVEL:-INFO}
      # public realm URL - equal to `iss` in tokens, used for browser redirects
      OIDC_ISSUER: ${KEYCLOAK_URL:-http://localhost:${KEYCLOAK_PORT}}/realms/ecommerce
      # the same realm from inside the network - token, jwks, userinfo
      OIDC_INTERNAL_URI: http://keycloak:8080/realms/ecommerce
      OIDC_CLIENT_ID: gateway
      OIDC_ROLES_CLAIM: realm_access.roles
      ORDER_SERVICE_URL: http://order-service:${ORDER_SERVICE_PORT}
      PAYMENT_SERVICE_URL: http://payment-service:${PAYMENT_SERVICE_PORT}
      INVENTORY_SERVICE_URL: http://inventory-service:${INVENTORY_SERVICE_PORT}
      SHIPPING_SERVICE_URL: http://shipping-service:${SHIPPING_SERVICE_PORT}
    # read as a property (spring.config.import: configtree): OidcProperties.clientSecret
    secrets:
      - source: gateway_client_secret
        target: oidc.client-secret
    # ready: started, not shutting down - the gateway has no database - what the web UI waits for
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${GATEWAY_PORT}/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
    depends_on:
      alloy:
        condition: service_started
      keycloak:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy

  web-ui:
    build:
      context: ./app/web-ui
      dockerfile: Dockerfile
    image: web-ui:latest
    networks:
      - app-network
    ports:
      - "${WEB_UI_PORT}:${WEB_UI_PORT}"
    environment:
      WEB_UI_PORT: ${WEB_UI_PORT}
      GATEWAY_ADDRESS: gateway-service:${GATEWAY_PORT}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      gateway-service:
        condition: service_healthy

networks:
  app-network:
    name: app-network
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  tempo-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  alloy-data:
  grafana-data:

# Every password, client secret and key reaches its container as a file in /run/secrets, never as an environment
# variable (which `docker inspect` shows). Here their values come from .env; in production
# (docker-compose.prod.yaml) from the files in secrets/. Either way the containers read the same files.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  # grafana_reader, the read-only Postgres user of Grafana's datasource - see docker/postgres/init-grafana-reader.sh
  grafana_db_password:
    environment: GRAFANA_DB_PASSWORD
  # Keycloak's own admin, in the master realm
  keycloak_admin_password:
    environment: KEYCLOAK_ADMIN_PASSWORD
  # the shop's admin, in the ecommerce realm
  app_admin_password:
    environment: APP_ADMIN_PASSWORD
  gateway_client_secret:
    environment: GATEWAY_CLIENT_SECRET
  order_service_client_secret:
    environment: ORDER_SERVICE_CLIENT_SECRET
  # Grafana's client in the internal realm (its sign-in through Keycloak, production only)
  grafana_client_secret:
    environment: GRAFANA_CLIENT_SECRET
  # the admin of the internal realm (docker/keycloak/realm-internal.json): Grafana's admin
  internal_admin_password:
    environment: INTERNAL_ADMIN_PASSWORD
  stripe_secret_key:
    environment: STRIPE_SECRET_KEY
  stripe_webhook_secret:
    environment: STRIPE_WEBHOOK_SECRET
  alert_smtp_password:
    environment: ALERT_SMTP_PASSWORD
