name: Web UI - Unit Tests

on:
  push:
    branches-ignore: [main]
    paths:
      - "app/web-ui/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web-ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v6

      # the ViewModel tests run on Node (downloaded by the Kotlin/JS plugin); the production bundle has to build too
      - run: ./gradlew jsNodeTest jsBrowserDistribution
