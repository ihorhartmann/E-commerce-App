name: Payment Service - Unit Tests

on:
  push:
    branches-ignore: [main]
    paths:
      - "app/payment-service/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/payment-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - run: mvn -B test -DexcludedGroups=integration
