name: Full Test Suite

# Every test, unit to e2e. A pull request into main runs it once it is ready for review - not while it is a draft, so
# pushing work in progress costs nothing - and again on every push after that; its single "Full suite" check, the
# last job, is what the branch rules of main require before a merge (GitHub's merge queue isn't available to a
# repository of a personal account). It runs on main after the merge too, and by hand.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  push:
    branches: [main]

# a newer push to the same pull request cancels the run of the one before
concurrency:
  group: full-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # --- stage 1: unit tests, all 5 services, the web UI and the alerting in parallel ---

  unit-inventory:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/inventory-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/inventory-service/go.mod
          cache-dependency-path: app/inventory-service/go.sum
      - run: go test ./...

  unit-shipping:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/shipping-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/shipping-service/go.mod
          cache-dependency-path: app/shipping-service/go.sum
      - run: go test ./...

  unit-order:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/order-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  unit-payment:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B test -DexcludedGroups=integration

  unit-gateway:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/gateway-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  unit-web-ui:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jsNodeTest jsBrowserDistribution

  # the alert rules and Alertmanager's routing, offline - the same steps as alerting.yml
  unit-alerting:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the alert rules
        run: >-
          docker run --rm -v "$PWD/docker/prometheus:/p:ro" --entrypoint promtool prom/prometheus:v3.15.1
          test rules /p/tests/alerts_test.yaml
      - name: Check Alertmanager's configuration and routing
        run: >-
          printf ci-password > "$RUNNER_TEMP/smtp_password" &&
          docker run --rm -v "$PWD/docker/alertmanager:/etc/alertmanager:ro"
          -v "$RUNNER_TEMP/smtp_password:/run/secrets/alert_smtp_password:ro"
          -e ALERT_SMTP_SMARTHOST=smtp.example.com:587 -e ALERT_SMTP_USERNAME=ci@example.com
          -e ALERT_SMTP_PASSWORD_FILE=/run/secrets/alert_smtp_password -e ALERT_EMAIL_FROM=ci@example.com
          -e ALERT_EMAIL_TO=ci@example.com -e GRAFANA_URL=http://localhost:8089
          --entrypoint /bin/sh prom/alertmanager:v0.34.2 /etc/alertmanager/entrypoint.sh check

  # --- stage 2: REST + Kafka integration tests, only if every unit job above passed ---

  integration-inventory:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway, unit-web-ui, unit-alerting]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/inventory-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/inventory-service/go.mod
          cache-dependency-path: app/inventory-service/go.sum
      - run: go test -tags=integration ./...

  integration-shipping:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway, unit-web-ui, unit-alerting]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/shipping-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/shipping-service/go.mod
          cache-dependency-path: app/shipping-service/go.sum
      - run: go test -tags=integration ./...

  integration-order:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway, unit-web-ui, unit-alerting]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/order-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -Pintegration

  integration-payment:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway, unit-web-ui, unit-alerting]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B test -Dgroups=integration

  # --- stage 3: e2e, only if every integration job above passed ---

  e2e:
    needs: [integration-inventory, integration-shipping, integration-order, integration-payment]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e_tests
    env:
      INVENTORY_SERVICE_PORT: 3001
      ORDER_SERVICE_PORT: 3002
      PAYMENT_SERVICE_PORT: 3003
      SHIPPING_SERVICE_PORT: 3004
      KAFKA_PORT: 9092
      KAFKA_HOST_PORT: 9094
      KAFKA_UI_PORT: 9098
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      KEYCLOAK_PORT: 8090
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      GATEWAY_PORT: 8080
      WEB_UI_PORT: 3000
      GRAFANA_PORT: 8089
      GRAFANA_DB_PASSWORD: e2e-grafana-reader-password
      ALLOY_UI_PORT: 12345
      GATEWAY_CLIENT_SECRET: e2e-gateway-secret
      ORDER_SERVICE_CLIENT_SECRET: e2e-order-service-secret
      GRAFANA_CLIENT_SECRET: e2e-grafana-secret
      INTERNAL_ADMIN_PASSWORD: e2e-internal-admin-password
      APP_ADMIN_PASSWORD: admin-password
      KC_TEST_CLIENTS_ENABLED: "true"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v6

      # StripeCliListener shells out to the `stripe` binary to forward real Stripe webhooks
      - name: Install Stripe CLI
        run: npm install -g @stripe/cli

      # stripe listen signs the webhooks it forwards with a secret Stripe issues for the key, and Stripe changes it now
      # and then: asked here from the same key the tests run stripe listen with, never kept as a copy in GitHub's secrets
      - name: Stripe CLI webhook secret
        run: |
          secret="$(stripe listen --print-secret --api-key "${STRIPE_SECRET_KEY}")"
          if [[ "${secret}" != whsec_* ]]; then
            echo "::error::stripe listen --print-secret gave no webhook secret"
            exit 1
          fi
          echo "::add-mask::${secret}"
          echo "STRIPE_WEBHOOK_SECRET=${secret}" >> "${GITHUB_ENV}"

      - run: ./gradlew test

      # why the stack didn't start (a failed pull or build, a service that exited) is only in testcontainers' log
      - name: Testcontainers log
        if: failure()
        run: tail -n 300 build/testcontainers.log || echo "no build/testcontainers.log - the tests didn't get that far"

  # --- the one check the branch rules of main require: every job above passed ---

  full-suite:
    name: Full suite
    needs:
      - unit-inventory
      - unit-shipping
      - unit-order
      - unit-payment
      - unit-gateway
      - unit-web-ui
      - unit-alerting
      - integration-inventory
      - integration-shipping
      - integration-order
      - integration-payment
      - e2e
    # always: a failed or cancelled job above would otherwise skip this one, and a skipped check counts as passed.
    # A draft is the exception: nothing ran, so the check is skipped too - grey, not a green it hasn't earned; a draft
    # can't be merged anyway, and "Ready for review" runs the suite
    if: always() && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::not every job passed: ${RESULTS}"
              exit 1
            fi
          done
          echo "every job passed"
