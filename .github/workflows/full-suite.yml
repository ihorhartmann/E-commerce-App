name: Full Test Suite

on:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # --- stage 1: unit tests, all 5 services in parallel ---

  unit-inventory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/inventory-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/inventory-service/go.mod
          cache-dependency-path: app/inventory-service/go.sum
      - run: go test ./...

  unit-shipping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/shipping-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/shipping-service/go.mod
          cache-dependency-path: app/shipping-service/go.sum
      - run: go test ./...

  unit-order:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/order-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  unit-payment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B test -DexcludedGroups=integration

  unit-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/gateway-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  # --- stage 2: REST + Kafka integration tests, only if every unit job above passed ---

  integration-inventory:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/inventory-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/inventory-service/go.mod
          cache-dependency-path: app/inventory-service/go.sum
      - run: go test -tags=integration ./...

  integration-shipping:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/shipping-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/shipping-service/go.mod
          cache-dependency-path: app/shipping-service/go.sum
      - run: go test -tags=integration ./...

  integration-order:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/order-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test -Pintegration

  integration-payment:
    needs: [unit-inventory, unit-shipping, unit-order, unit-payment, unit-gateway]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/payment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven
      - run: mvn -B test -Dgroups=integration

  # --- stage 3: e2e, only if every integration job above passed ---

  e2e:
    needs: [integration-inventory, integration-shipping, integration-order, integration-payment]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e_tests
    env:
      INVENTORY_SERVICE_PORT: 3001
      ORDER_SERVICE_PORT: 3002
      PAYMENT_SERVICE_PORT: 3003
      SHIPPING_SERVICE_PORT: 3004
      KAFKA_PORT: 9092
      KAFKA_HOST_PORT: 9094
      KAFKA_UI_PORT: 9090
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
      KEYCLOAK_PORT: 8090
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      GATEWAY_PORT: 8080
      GATEWAY_CLIENT_SECRET: e2e-gateway-secret
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v6

      # StripeCliListener shells out to the `stripe` binary to forward real Stripe webhooks
      - name: Install Stripe CLI
        run: npm install -g @stripe/cli

      - run: ./gradlew test
