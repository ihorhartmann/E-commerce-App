name: Order Service - Unit Tests

on:
  push:
    branches-ignore: [main]
    paths:
      - "app/order-service/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/order-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"

      - uses: gradle/actions/setup-gradle@v6

      # excludes @Tag("integration") by default - see build.gradle.kts
      - run: ./gradlew test
