# Production: what differs from docker-compose.yaml on the server (infrastructure/contabo/README.md). The server's
# .env names both files in COMPOSE_FILE, so a plain `docker compose ...` there always merges them.
#
# * Our own services run the images the Build Images workflow pushed to GHCR - nothing is built on the server.
# * Only Caddy is reachable from the internet (80, 443): it terminates TLS for ${DOMAIN} (the shop - the web UI and
#   the gateway's paths),
#   auth.${DOMAIN} (Keycloak's sign-in pages) and grafana.${DOMAIN} (signed in through Keycloak). The other tools are
#   bound to 127.0.0.1 and reached through an SSH tunnel; a port Docker publishes goes around ufw, so nothing else may
#   be published on 0.0.0.0.
# * Every container has a memory limit, so that one of them can't starve the rest of the 12 GB, and is started
#   again after a crash or a reboot.
#
# A list in this file is appended to the one in docker-compose.yaml when the two are merged: `!override` replaces it,
# `!reset` removes it.

x-restart: &restart
  restart: unless-stopped

# the JVM sizes its heap from the container's limit, but takes only a quarter of it by default. Half, not more: a
# Spring service's non-heap (metaspace, code cache) is 130-220 MiB, and thread stacks, GC and buffers come on top -
# with a bigger heap, a full one would push the container over its limit, killed without an OutOfMemoryError in the log
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50

services:
  caddy:
    <<: *restart
    mem_limit: 128m
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is not set}
      # Let's Encrypt's staging CA unless the real one is chosen explicitly: its certificates aren't trusted by
      # browsers, but it has no rate limits worth speaking of - a misconfiguration retried over and over can't lock
      # the domain out of real certificates for a week
      ACME_CA: ${ACME_CA:-https://acme-staging-v02.api.letsencrypt.org/directory}
    volumes: !override
      # HTTPS, the shop (shop.caddy, the same routes as locally), Keycloak's and Grafana's hosts
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/shop.caddy:/etc/caddy/shop.caddy:ro
      # the certificates and the ACME account: lost, every start would order new ones
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      keycloak:
        condition: service_started
      grafana:
        condition: service_started

  postgres:
    <<: *restart
    mem_limit: 512m
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  keycloak:
    <<: *restart
    mem_limit: 1g
    # the production mode: no dev defaults, the hostname enforced
    command: ["start", "--import-realm"]
    ports: !override
      # the admin console, through the tunnel only (see KC_HOSTNAME_ADMIN)
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    environment:
      # TLS ends at Caddy, which talks plain HTTP to Keycloak and tells it the browser's scheme and host
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Caddy publishes only the sign-in pages (/realms, /resources); the admin console lives on the tunnel's address
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_PORT}
      # no password grant (e2e-tests) and no Postman client on the internet
      KC_TEST_CLIENTS_ENABLED: "false"
      # the image's default heap is 70% of the limit, which leaves too little next to its ~240 MiB of non-heap
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60 -XX:MinRAMPercentage=60 -XX:InitialRAMPercentage=50

  kafka:
    <<: *restart
    mem_limit: 1g
    ports: !reset []
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      # the internal listener only: no client outside Docker's network
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

  kafka-ui:
    <<: *restart
    mem_limit: 512m
    ports: !override
      # no login of its own: through the tunnel only
      - "127.0.0.1:${KAFKA_UI_PORT}:8080"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75

  tempo:
    <<: *restart
    mem_limit: 512m

  loki:
    <<: *restart
    mem_limit: 512m

  prometheus:
    <<: *restart
    mem_limit: 512m

  alertmanager:
    <<: *restart
    mem_limit: 64m
    environment:
      # the emails' links lead to the public Grafana
      GRAFANA_URL: ${GRAFANA_PUBLIC_URL:?GRAFANA_PUBLIC_URL is not set}

  alloy:
    <<: *restart
    # the same as in docker-compose.yaml, which has one too: memory_limiter (docker/alloy/config.alloy) reads it
    mem_limit: 512m
    ports: !override
      - "127.0.0.1:${ALLOY_UI_PORT}:12345"

  grafana:
    <<: *restart
    mem_limit: 1g
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    environment:
      # public at grafana.${DOMAIN} (Caddy), every visitor signed in through Keycloak: no anonymous user, no login form
      # of Grafana's own, no password in an API call - only the grafana client of the internal realm
      # (docker/keycloak/realm-internal.json), the staff's, apart from the shop's customers and their sessions. Its role
      # comes from the realm roles in the token's `roles` claim: ADMIN is Grafana's admin, OBSERVER (the published demo
      # account `observer`) a viewer; anyone else is turned away
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:?GRAFANA_PUBLIC_URL is not set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET__FILE: /run/secrets/grafana_client_secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # the browser goes to the public URL; Grafana itself calls Keycloak inside Docker's network
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_URL:?KEYCLOAK_URL is not set}/realms/internal/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/internal/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/internal/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(roles[*], 'ADMIN') && 'GrafanaAdmin' || contains(roles[*], 'OBSERVER') && 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # signing out of Grafana signs out of Keycloak too, back to Grafana's sign-in
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${KEYCLOAK_URL}/realms/internal/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=${GRAFANA_PUBLIC_URL}/login
      # a viewer may query in Explore - the logs, traces and metrics hold no personal data (docker/alloy/config.alloy,
      # docker/postgres/grafana-views.sql) - but saves nothing, and keeps no copy of a dashboard
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      GF_SNAPSHOTS_ENABLED: "false"
      # the admin of Grafana's own, from its first start: no way in any more but through Keycloak
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
      - grafana_client_secret

  inventory-service:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/inventory-service:${INVENTORY_SERVICE_IMAGE_TAG:?INVENTORY_SERVICE_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 128m
    ports: !reset []

  order-service:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/order-service:${ORDER_SERVICE_IMAGE_TAG:?ORDER_SERVICE_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 768m
    ports: !reset []
    environment:
      <<: *jvm

  payment-service:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/payment-service:${PAYMENT_SERVICE_IMAGE_TAG:?PAYMENT_SERVICE_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 768m
    ports: !reset []
    environment:
      <<: *jvm

  shipping-service:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/shipping-service:${SHIPPING_SERVICE_IMAGE_TAG:?SHIPPING_SERVICE_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 128m
    ports: !reset []

  gateway-service:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/gateway-service:${GATEWAY_SERVICE_IMAGE_TAG:?GATEWAY_SERVICE_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 768m
    ports: !reset []
    environment:
      <<: *jvm

  web-ui:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is not set}/web-ui:${WEB_UI_IMAGE_TAG:?WEB_UI_IMAGE_TAG is not set - versions.env, copied by deploy.sh}
    build: !reset null
    <<: *restart
    mem_limit: 64m
    # reached by Caddy only, inside Docker's network
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:

# The secrets come from the files in secrets/ (infrastructure/contabo/scripts/generate-env-and-secrets.sh) instead of .env,
# which holds no secret here. Compose mounts each file as it is on the host, ignoring a secret's mode: secrets/ is
# readable by root only (700), the files in it by anyone (644) - the containers that read them run as other users.
secrets:
  postgres_password: !override
    file: ./secrets/postgres_password
  grafana_db_password: !override
    file: ./secrets/grafana_db_password
  keycloak_admin_password: !override
    file: ./secrets/keycloak_admin_password
  app_admin_password: !override
    file: ./secrets/app_admin_password
  gateway_client_secret: !override
    file: ./secrets/gateway_client_secret
  order_service_client_secret: !override
    file: ./secrets/order_service_client_secret
  grafana_client_secret: !override
    file: ./secrets/grafana_client_secret
  internal_admin_password: !override
    file: ./secrets/internal_admin_password
  stripe_secret_key: !override
    file: ./secrets/stripe_secret_key
  stripe_webhook_secret: !override
    file: ./secrets/stripe_webhook_secret
  alert_smtp_password: !override
    file: ./secrets/alert_smtp_password
  # Grafana's admin: a login of its own in production, an anonymous admin locally (docker-compose.yaml)
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
