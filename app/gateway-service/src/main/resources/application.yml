server:
  port: ${GATEWAY_PORT}
  # behind the web UI's nginx: build redirect URIs ({baseUrl}) from the X-Forwarded-* headers it sets, i.e. from the
  # address the browser actually uses
  forward-headers-strategy: framework
  reactive:
    session:
      cookie:
        # explicit rather than left to each browser's default: not sent on cross-site POSTs (CSRF), still sent when
        # Keycloak redirects back after login
        same-site: lax

# The `oidc.*` properties (OidcProperties) are deliberately not declared here: Spring binds them straight from the
# env vars OIDC_ISSUER, OIDC_INTERNAL_URI, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, OIDC_ROLES_CLAIM. A `${...}` placeholder
# here would be bound as a literal string when its env var is missing, and the gateway would start misconfigured;
# without it, a missing env var fails the startup.

spring:
  reactor:
    # WebFlux runs a request on whichever thread is free at each step, so the MDC - a thread-local - would not have
    # the request's traceId and spanId; restores them, from the request's Reactor context, on every step
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # browser requests: replaces the session cookie with the session's access token (refreshed when expired);
            # Bearer requests (Postman, e2e, mobile) pass through with their own Authorization header untouched
            - TokenRelay=
            - RemoveRequestHeader=Cookie
            - RemoveRequestHeader=X-XSRF-TOKEN
            # only the services send each other the saga's correlation id: one from a client would put its own value
            # into their log lines
            - RemoveRequestHeader=X-Correlation-Id
          # a service that can't be connected to is reported (503) after 2s, one that doesn't answer (504) after 10s -
          # or its route's own response-timeout - instead of the request hanging; see GlobalExceptionHandler
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/v1/orders/**
              metadata:
                # Placing an order waits for the inventory- and the payment-service, the payment for Stripe: up to 5s
                # and 35s (order-service's read timeouts). The gateway waits longer than that, so it never gives up on
                # an order the order-service is still placing - the client would be told it failed while it succeeds.
                # In milliseconds.
                response-timeout: 45000
            - id: stripe-webhook
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/v1/webhooks/stripe
            - id: inventory-service
              uri: ${INVENTORY_SERVICE_URL}
              predicates:
                - Path=/api/v1/products/**
            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URL}
              predicates:
                - Path=/api/v1/shipments/**

management:
  endpoints:
    web:
      # /health, /health/liveness, /health/readiness - the same paths as the services
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      # the liveness and readiness groups outside Kubernetes too; the gateway has no database, so readiness is only
      # "started and not shutting down"
      probes:
        enabled: true
  # Traces and metrics go to the collector (Alloy) over OTLP/HTTP. Spring Boot reads OTEL_EXPORTER_OTLP_ENDPOINT and
  # OTEL_SERVICE_NAME itself for the traces (no placeholders - see TracingConfig). The gateway is where traces start: a
  # request without a traceparent header gets a new trace here, which the services continue
  tracing:
    sampling:
      # every trace is kept (the default is 0.1); the services follow the gateway's decision
      probability: 1.0
  opentelemetry:
    resource-attributes:
      # one per replica - the container id in Docker, the pod name in Kubernetes - so that the metrics of two replicas
      # aren't the same series in Prometheus
      "[service.instance.id]": ${HOSTNAME:${random.uuid}}
  observations:
    enable:
      # Spring Security's span per filter chain step: noise in every trace, and roots of their own for the
      # requests whose server span is skipped (health checks, see TracingConfig)
      "[spring.security]": false
  otlp:
    metrics:
      export:
        # required by TracingConfig, so the placeholder always resolves
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        # the same step as the Go services' export interval
        step: 15s
        # timers in seconds, as OpenTelemetry's semantic conventions and the Go services have them
        base-time-unit: seconds
  metrics:
    distribution:
      # explicit buckets, the same as the services', so the percentiles of every service come from the same buckets
      slo:
        "[http.server.request.duration]": 5ms,10ms,25ms,50ms,75ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,7500ms,10s
  # logs stay on stdout (Alloy reads them from there)
  logging:
    export:
      otlp:
        enabled: false

# one JSON object per line on stdout, which Alloy reads and pushes to Loki: the trace and span ids Micrometer Tracing
# puts in the MDC, and the key-value pairs of a log event, become fields of their own
logging:
  structured:
    format:
      console: logstash
