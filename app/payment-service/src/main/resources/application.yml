server:
  port: ${PAYMENT_SERVICE_PORT}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  connect-timeout: 2s
  # The order service's read timeout for a payment call is sized to outlast this read timeout
  # across every Stripe network retry StripePaymentGateway allows - keep the two in step
  read-timeout: 8s

# Keycloak realm whose access tokens this service accepts (read via @Value, so a missing env var fails the startup)
oidc:
  # public realm URL - equal to `iss` in every token
  issuer: ${OIDC_ISSUER}
  # the realm's public keys, reached from inside the network
  jwks-uri: ${OIDC_JWKS_URI}
  # dot-separated path to the roles array inside the token, e.g. realm_access.roles
  roles-claim: ${OIDC_ROLES_CLAIM}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jooq:
    sql-dialect: postgres
  flyway:
    schemas: payment
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      fail-fast: true
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: batch
