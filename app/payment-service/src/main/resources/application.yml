server:
  port: ${PAYMENT_SERVICE_PORT}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    consumer:
      group-id: payment-service
      enable-auto-commit: false
    listener:
      ack-mode: batch
