server:
  port: ${PAYMENT_SERVICE_PORT}

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  connect-timeout: 2s
  # The order service's read timeout for a payment call is sized to outlast this read timeout
  # across every Stripe network retry StripePaymentGateway allows - keep the two in step
  read-timeout: 8s

# Keycloak realm whose access tokens this service accepts (read via @Value, so a missing env var fails the startup)
oidc:
  # public realm URL - equal to `iss` in every token
  issuer: ${OIDC_ISSUER}
  # the realm's public keys, reached from inside the network
  jwks-uri: ${OIDC_JWKS_URI}
  # dot-separated path to the roles array inside the token, e.g. realm_access.roles
  roles-claim: ${OIDC_ROLES_CLAIM}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jooq:
    sql-dialect: postgres
  flyway:
    schemas: payment
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      fail-fast: true
    consumer:
      group-id: payment-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # how long a batch waits to fill up before it is sent - the client's default, set here so it stays the same
        # 5ms the Go services wait whatever a client upgrade changes
        "[linger.ms]": 5
    # a producer span per send and a consumer span per record, linked through the traceparent header
    template:
      observation-enabled: true
    listener:
      ack-mode: batch
      observation-enabled: true

# Traces go to the collector (Alloy) over OTLP/HTTP. Spring Boot reads OTEL_EXPORTER_OTLP_ENDPOINT and
# OTEL_SERVICE_NAME itself (no placeholders here - see TracingConfig)
management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      "[spring.security]": false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# a span per SQL statement (datasource-micrometer), the statement in its jdbc.query attribute as prepared - with ? for
# what is bound to it: statements only - not getting a connection or reading a result set - and never the bound values
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false

# one JSON object per line on stdout, which Alloy reads and pushes to Loki: the trace and span ids Micrometer Tracing
# puts in the MDC, and the key-value pairs of a log event, become fields of their own
logging:
  structured:
    format:
      console: logstash
