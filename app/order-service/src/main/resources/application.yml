server:
  port: ${ORDER_SERVICE_PORT}

http-client:
  connect-timeout: 2s

# Keycloak realm whose access tokens this service accepts (read via @Value, so a missing env var fails the startup)
oidc:
  # public realm URL - equal to `iss` in every token
  issuer: ${OIDC_ISSUER}
  # the realm's public keys, reached from inside the network
  jwks-uri: ${OIDC_JWKS_URI}
  # dot-separated path to the roles array inside the token, e.g. realm_access.roles
  roles-claim: ${OIDC_ROLES_CLAIM}
  # this service's own client: its calls to the inventory- and payment-service carry a client-credentials token
  token-uri: ${OIDC_TOKEN_URI}
  client-id: ${OIDC_CLIENT_ID}
  client-secret: ${OIDC_CLIENT_SECRET}

inventory-service:
  url: ${INVENTORY_SERVICE_URL}
  read-timeout: 5s

payment-service:
  url: ${PAYMENT_SERVICE_URL}
  # Must outlast the payment service's own worst case for one call: up to 3 Stripe attempts
  # (2s connect + 8s read timeout each) plus the Stripe SDK's backoff between them
  read-timeout: 35s

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      fail-fast: true
    consumer:
      group-id: order-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # how long a batch waits to fill up before it is sent - the client's default, set here so it stays the same
        # 5ms the Go services wait whatever a client upgrade changes
        "[linger.ms]": 5
    # a producer span per send and a consumer span per record, linked through the traceparent header
    template:
      observation-enabled: true
    listener:
      ack-mode: batch
      observation-enabled: true

# Traces go to the collector (Alloy) over OTLP/HTTP. Spring Boot reads OTEL_EXPORTER_OTLP_ENDPOINT and
# OTEL_SERVICE_NAME itself (no placeholders here - see TracingConfig)
management:
  tracing:
    sampling:
      probability: 1.0
  observations:
    enable:
      "[spring.security]": false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

# a span per SQL statement (datasource-micrometer), the statement in its jdbc.query attribute as prepared - with ? for
# what is bound to it: statements only - not getting a connection or reading a result set - and never the bound values
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false
