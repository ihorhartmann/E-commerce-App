server:
  port: ${ORDER_SERVICE_PORT}

http-client:
  connect-timeout: 2s

# Keycloak realm whose access tokens this service accepts (read via @Value, so a missing env var fails the startup)
oidc:
  # public realm URL - equal to `iss` in every token
  issuer: ${OIDC_ISSUER}
  # the realm's public keys, reached from inside the network
  jwks-uri: ${OIDC_JWKS_URI}
  # dot-separated path to the roles array inside the token, e.g. realm_access.roles
  roles-claim: ${OIDC_ROLES_CLAIM}
  # this service's own client: its calls to the inventory- and payment-service carry a client-credentials token
  token-uri: ${OIDC_TOKEN_URI}
  client-id: ${OIDC_CLIENT_ID}
  client-secret: ${OIDC_CLIENT_SECRET}

inventory-service:
  url: ${INVENTORY_SERVICE_URL}
  read-timeout: 5s

payment-service:
  url: ${PAYMENT_SERVICE_URL}
  # Must outlast the payment service's own worst case for one call: up to 3 Stripe attempts
  # (2s connect + 8s read timeout each) plus the Stripe SDK's backoff between them
  read-timeout: 35s

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      fail-fast: true
      # how long the startup waits for Kafka to declare the topics - as long as the Go services wait
      operation-timeout: 60s
    consumer:
      group-id: order-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # how long a batch waits to fill up before it is sent - the client's default, set here so it stays the same
        # 5ms the Go services wait whatever a client upgrade changes
        "[linger.ms]": 5
    # a producer span per send and a consumer span per record, linked through the traceparent header
    template:
      observation-enabled: true
    listener:
      ack-mode: batch
      observation-enabled: true

management:
  endpoints:
    web:
      # /health, /health/liveness, /health/readiness - the same paths as the gateway and the Go services
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      # the liveness and readiness groups outside Kubernetes too
      probes:
        enabled: true
      group:
        readiness:
          # started, not shutting down, and the database answers. Kafka is no part of it: messages go out through the
          # outbox, and the consumer retries on its own
          include: readinessState,db
  # Traces and metrics go to the collector (Alloy) over OTLP/HTTP. Spring Boot reads OTEL_EXPORTER_OTLP_ENDPOINT and
  # OTEL_SERVICE_NAME itself for the traces (no placeholders - see TracingConfig)
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    resource-attributes:
      # one per replica - the container id in Docker, the pod name in Kubernetes - so that the metrics of two replicas
      # aren't the same series in Prometheus
      "[service.instance.id]": ${HOSTNAME:${random.uuid}}
  observations:
    enable:
      "[spring.security]": false
  otlp:
    metrics:
      export:
        # required by TracingConfig, so the placeholder always resolves
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
        # the same step as the Go services' export interval
        step: 15s
        # timers in seconds, as OpenTelemetry's semantic conventions and the Go services have them
        base-time-unit: seconds
  metrics:
    enable:
      # The Kafka clients' own metrics - hundreds of them - and Spring Kafka's timers are left out: the consumer lag
      # comes from Alloy's Kafka exporter, the handling of a message from ecommerce.kafka.* (KafkaMetricsInterceptor)
      kafka: false
      "[spring.kafka]": false
    distribution:
      # explicit buckets, the same as the Go services', so the percentiles of every service come from the same buckets
      slo:
        "[http.server.request.duration]": 5ms,10ms,25ms,50ms,75ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,7500ms,10s
        "[http.client.requests]": 5ms,10ms,25ms,50ms,75ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,7500ms,10s
        "[jdbc.query]": 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2500ms
        "[ecommerce.kafka.message.duration]": 5ms,10ms,25ms,50ms,75ms,100ms,250ms,500ms,750ms,1s,2500ms,5s,7500ms,10s
  # logs stay on stdout (Alloy reads them from there)
  logging:
    export:
      otlp:
        enabled: false

# a span per SQL statement (datasource-micrometer), the statement in its jdbc.query attribute as prepared - with ? for
# what is bound to it: statements only - not getting a connection or reading a result set - and never the bound values
jdbc:
  includes: QUERY
  datasource-proxy:
    include-parameter-values: false

# one JSON object per line on stdout, which Alloy reads and pushes to Loki: the trace and span ids Micrometer Tracing
# puts in the MDC, and the key-value pairs of a log event, become fields of their own
logging:
  structured:
    format:
      console: logstash
