server:
  port: ${ORDER_SERVICE_PORT}

http-client:
  connect-timeout: 2s

# Keycloak realm whose access tokens this service accepts (read via @Value, so a missing env var fails the startup)
oidc:
  # public realm URL - equal to `iss` in every token
  issuer: ${OIDC_ISSUER}
  # the realm's public keys, reached from inside the network
  jwks-uri: ${OIDC_JWKS_URI}
  # dot-separated path to the roles array inside the token, e.g. realm_access.roles
  roles-claim: ${OIDC_ROLES_CLAIM}

inventory-service:
  url: ${INVENTORY_SERVICE_URL}
  read-timeout: 5s

payment-service:
  url: ${PAYMENT_SERVICE_URL}
  # Must outlast the payment service's own worst case for one call: up to 3 Stripe attempts
  # (2s connect + 8s read timeout each) plus the Stripe SDK's backoff between them
  read-timeout: 35s

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: orders
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: orders
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    admin:
      fail-fast: true
    consumer:
      group-id: order-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: batch
