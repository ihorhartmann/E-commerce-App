# A file, not the console: a green run would print thousands of lines of image builds. CI prints the end of it when
# the tests fail (.github/workflows/full-suite.yml). The path is relative to e2e_tests, Gradle's working directory
org.slf4j.simpleLogger.logFile=build/testcontainers.log
org.slf4j.simpleLogger.defaultLogLevel=warn
# what testcontainers does: Docker found, the stack started, waiting for a service
org.slf4j.simpleLogger.log.org.testcontainers=info
# tc.* are testcontainers' own loggers (DockerLoggerFactory) for what it runs: tc.docker carries the output of
# `docker compose` - pulls, builds, and the error a failed start exits with - which it logs as INFO
org.slf4j.simpleLogger.log.tc=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
