# The realm's login theme (sign-in, registration, password reset): Keycloak's own pages restyled to the web UI's glass
# look. Everything not listed here - templates, messages, the PatternFly styles - comes from keycloak.v2.
parent=keycloak.v2
import=common/keycloak
# css/styles.css is keycloak.v2's own; glass.css is the web UI's (mounted by docker-compose), login.css maps it onto
# Keycloak's PatternFly markup
styles=css/styles.css css/glass.css css/login.css
# always dark, like the web UI, whatever the visitor's system preference
darkMode=false
