# Single-binary Loki: every component in one process, chunks and index on the local volume.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # local development: a week of logs is plenty, and keeps the volume small
  retention_period: 168h
  # the trace id of a line is kept next to it (structured metadata), not as a label: a label per trace would make a
  # stream - and an index entry - per request
  allow_structured_metadata: true
  # the stream already has its service and level labels from Alloy - no service_name or detected_level copy of them
  discover_service_name: []
  discover_log_levels: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
