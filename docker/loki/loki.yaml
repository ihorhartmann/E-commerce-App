# Single-binary Loki: every component in one process, chunks and index on the local volume.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # local development: a week of logs is plenty, and keeps the volume small
  retention_period: 168h
  # the trace id of a line is kept next to it (structured metadata), not as a label: a label per trace would make a
  # stream - and an index entry - per request
  allow_structured_metadata: true
  # Alloy labels the stream with service_name itself - no copy of it from other labels
  discover_service_name: []
  # detected_level, from the level of a JSON line, for Logs Drilldown's level filter - structured metadata, not a
  # label; the level label from Alloy stays, for the queries that pick WARN and ERROR lines before parsing any JSON
  discover_log_levels: true
  # Grafana's viewers can send any query: one can't keep Loki busy for long, nor pull the whole store at once
  max_query_length: 168h
  query_timeout: 30s
  max_entries_limit_per_query: 2000

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
