# Monolithic Tempo (-target=all): every component in one process, blocks on the local volume.
# Traces arrive from Alloy only - the OTLP receiver is reachable inside the compose network, not from the host.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      # local development: three days of traces is plenty, and keeps the volume small
      block_retention: 72h

usage_report:
  reporting_enabled: false
